<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1A1714">
<title>{{ page.title | default: site.title | escape }}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%231A1714'/%3E%3Cpath d='M188 112H156A24 24 0 0 0 132 136V168M324 112H356A24 24 0 0 1 380 136V168M380 344V376A24 24 0 0 1 356 400H324M132 344V376A24 24 0 0 0 156 400H188' fill='none' stroke='%23FAF9F5' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='142' y='246' width='228' height='20' rx='10' fill='%23E3A04A'/%3E%3C/svg%3E">
<style>
  /* Renkler uygulamanın paletinden: kaptra-app/lib/core/theme/app_palette.dart */
  :root {
    color-scheme: dark;
    --ink: #1A1714;
    --paper: #FAF9F5;
    --amber: #E3A04A;
    --muted: #B3ABA0;
    --outline: #807669;
    --line: #3A342E;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font: 1.0625rem/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-wrap: break-word;
  }

  .page { max-width: 40rem; margin: 0 auto; padding: 0 1rem 4rem; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--line);
  }

  /* Dokunma hedefi en az 44 px, uygulamadaki gibi. */
  header a { display: inline-block; padding: .75rem 0; }
  header .brand { color: var(--paper); font-weight: 600; text-decoration: none; }

  a { color: var(--amber); text-underline-offset: .15em; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 2px; }

  h1, h2 { font-weight: 600; line-height: 1.3; }
  h1 { font-size: 1.75rem; margin: 0 0 .75rem; }
  h2 { font-size: 1.25rem; margin: 2.5rem 0 .75rem; }

  /* Başlığın altındaki satır: politikalarda "Son güncelleme", ana sayfada tanım. */
  h1 + p { color: var(--muted); }

  p, ul { margin: 0 0 1rem; }
  ul { padding-left: 1.25rem; }
  li { margin: .5rem 0; }
  li::marker { color: var(--muted); }
  strong { font-weight: 600; }

  /* Ana sayfa: küçük ürün sayfası. */
  .landing { padding: 3rem 0 1rem; text-align: center; }
  .landing .icon { display: block; width: 6rem; height: 6rem; margin: 0 auto 1.25rem; }
  .landing .about { max-width: 32rem; margin: 2rem auto 0; }
  .landing .buttons { list-style: none; max-width: 20rem; margin: 2rem auto 0; padding: 0; }
  .landing .buttons li { margin: .75rem 0 0; }
  .landing .buttons a {
    display: block;
    padding: .875rem 1rem;
    border: 1px solid var(--outline);
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
  }
  .landing .buttons a:hover { border-color: var(--amber); }
  .landing .support { margin-top: 2.5rem; color: var(--muted); }
  .landing .support a { display: inline-block; padding: .5rem 0; }

  /* Koyu zemin kâğıda basılmıyor; açık renk metin de kaybolmasın. */
  @media print {
    body { background: #fff; color: #000; }
    header { display: none; }
    a, h1 + p, li::marker { color: inherit; }
  }
</style>
</head>
<body>
<div class="page">
{%- if page.alternate %}
<header>
  <a class="brand" href="/">{{ site.title }}</a>
  <a href="{{ page.alternate.url }}" hreflang="{{ page.alternate.lang }}" lang="{{ page.alternate.lang }}">{{ page.alternate.label }}</a>
</header>
{%- endif %}
<main>
{{ content }}
</main>
</div>
</body>
</html>
